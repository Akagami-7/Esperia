<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Count-in & Metronome Button</title>
  <style>
    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Outer box containing both buttons — completely stationary, only fades color on hover */
    .pill-container {
      position: relative;
      display: inline-flex;
      gap: 2px;
      height: 40px;
      background-color: transparent;
      border-radius: 14px;
      corner-shape: squircle;
      user-select: none;
      transition: background-color 0.16s ease;
    }

    /* Reveal only the flat outer box on hover (zero movement or shadow on the box) */
    .pill-container:hover {
      background-color: #8c8c8c;
    }

    .slot-btn {
      position: relative;
      width: 46px;
      height: 40px;
      border: none;
      background: transparent;
      border-radius: 14px;
      corner-shape: squircle;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #515151;
      outline: none;
      transform: translateY(0) scale(1);
      box-shadow: inset 0 0 0 rgba(0, 0, 0, 0);
      transition:
        background-color 0.16s ease,
        color 0.16s ease,
        box-shadow 0.18s ease,
        transform 0.34s cubic-bezier(0.22, 1.65, 0.36, 1);
    }

    /* Tactile inward press strictly on the button */
    .slot-btn:active {
      transform: scale(0.94);
      box-shadow:
        inset 0 3px 6px rgba(0, 0, 0, 0.28),
        inset 0 1px 2px rgba(0, 0, 0, 0.22);
      transition:
        transform 0.06s ease-out,
        box-shadow 0.06s ease-out;
    }

    /* Active purple button with 3D specular top edge & depth */
    .slot-btn.active {
      background: linear-gradient(180deg, #8b33b8 0%, #73259b 100%);
      color: #f5e8ff;
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, 0.32),
        inset 0 -1.5px 2px rgba(32, 7, 46, 0.35),
        0 3px 8px rgba(78, 22, 108, 0.32);
    }

    /* Active button pressed down */
    .slot-btn.active:active {
      background: linear-gradient(180deg, #6e2394 0%, #7d29a7 100%);
      transform: scale(0.94);
      box-shadow:
        inset 0 3px 6px rgba(25, 5, 36, 0.48),
        inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* Icon micro-spring inside the button */
    .slot-btn svg {
      width: 46px;
      height: 40px;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.12));
      transition:
        transform 0.36s cubic-bezier(0.22, 1.75, 0.36, 1),
        filter 0.16s ease;
    }

    .slot-btn.active svg {
      filter: drop-shadow(0 1px 1.5px rgba(25, 5, 36, 0.4));
    }

    .slot-btn:active svg {
      transform: scale(0.92);
      transition: transform 0.06s ease-out;
    }
  </style>
</head>
<body>

  <div class="pill-container">
    <!-- Left Slot: Count-in -->
    <button class="slot-btn" id="countinBtn" type="button" title="Count-in">
      <svg width="46" height="40" viewBox="0 0 46 40" fill="none">
        <path d="M11.5 19.5C15.5 13.5 23.5 10 32.5 9.5" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 2.5"/>
        <rect x="10.5" y="23" width="3.8" height="6" rx="1.9" fill="currentColor" fill-opacity="0.5"/>
        <rect x="17.5" y="19.5" width="3.8" height="9.5" rx="1.9" fill="currentColor" fill-opacity="0.7"/>
        <rect x="24.5" y="16" width="3.8" height="13" rx="1.9" fill="currentColor" fill-opacity="0.88"/>
        <rect id="peakBar" x="31.5" y="12" width="4.2" height="17" rx="2.1" fill="currentColor"/>
      </svg>
    </button>

    <!-- Right Slot: Metronome -->
    <button class="slot-btn" id="metronomeBtn" type="button" title="Metronome">
      <svg width="46" height="40" viewBox="0 0 46 40" fill="none">
        <circle cx="23" cy="10.2" r="2.1" fill="currentColor"/>
        <rect x="20.9" y="14.2" width="4.2" height="14.8" rx="2.1" fill="currentColor"/>
        <path d="M16.2 17.1C14.4 19.5 14.4 23.7 16.2 26.1" stroke="currentColor" stroke-opacity="0.85" stroke-width="2.1" stroke-linecap="round"/>
        <path d="M29.8 17.1C31.6 19.5 31.6 23.7 29.8 26.1" stroke="currentColor" stroke-opacity="0.85" stroke-width="2.1" stroke-linecap="round"/>
        <path d="M12.0 14.6C9.4 18.4 9.4 24.8 12.0 28.6" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="2 2.5"/>
        <path d="M34.0 14.6C36.6 18.4 36.6 24.8 34.0 28.6" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="2 2.5"/>
      </svg>
    </button>
  </div>

  <script>
    const countinBtn = document.getElementById('countinBtn');
    const metronomeBtn = document.getElementById('metronomeBtn');
    const peakBar = document.getElementById('peakBar');
    const tauriInvoke = window.__TAURI__?.core?.invoke;

    function applyState(countin, metronome) {
      countinBtn.classList.toggle('active', countin);
      peakBar.setAttribute('fill', countin ? '#ffffff' : 'currentColor');
      metronomeBtn.classList.toggle('active', metronome);
    }

    if (tauriInvoke) {
      tauriInvoke('get_count_metronome_state').then(([c, m]) => applyState(c, m));
    }

    countinBtn.addEventListener('click', async () => {
      const isActive = tauriInvoke
        ? await tauriInvoke('toggle_countin')
        : countinBtn.classList.toggle('active');
      countinBtn.classList.toggle('active', isActive);
      peakBar.setAttribute('fill', isActive ? '#ffffff' : 'currentColor');
    });

    metronomeBtn.addEventListener('click', async () => {
      const isActive = tauriInvoke
        ? await tauriInvoke('toggle_metronome')
        : metronomeBtn.classList.toggle('active');
      metronomeBtn.classList.toggle('active', isActive);
    });
  </script>

</body>
</html>
