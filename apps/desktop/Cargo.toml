[package]
name = "esperia-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
esperia-audio-engine = { version = "0.1.0", path = "../../crates/audio-engine" }
esperia-audio-io = { version = "0.1.0", path = "../../crates/audio-io" }
esperia-project-model = { version = "0.1.0", path = "../../crates/project-model" }
esperia-media = { version = "0.1.0", path = "../../crates/media" }
esperia-recording = { version = "0.1.0", path = "../../crates/recording" }
esperia-mixer = { version = "0.1.0", path = "../../crates/mixer" }
esperia-midi = { version = "0.1.0", path = "../../crates/midi" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rfd = "0.15"
tauri = "2.12.7"
urlencoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17.2", default-features = false }

[build-dependencies]
tauri-build = "2.7.6"
