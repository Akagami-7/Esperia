[package]
name = "esperia-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eframe = "0.37.0"
esperia-audio-engine = { version = "0.1.0", path = "../../crates/audio-engine" }
esperia-audio-io = { version = "0.1.0", path = "../../crates/audio-io" }
esperia-project-model = { version = "0.1.0", path = "../../crates/project-model" }
esperia-media = { version = "0.1.0", path = "../../crates/media" }
