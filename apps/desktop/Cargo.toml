esperia-midi = { version = "0.1.0", path = "../../crates/midi" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17.2", default-features = false }


