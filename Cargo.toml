[workspace]
members = [
    "apps/desktop",
    "crates/audio-io",
    "crates/audio-engine",
    "crates/project-model",
    "crates/media",
    "crates/recording",
    "crates/mixer",
    "crates/midi",
]
default-members = [
    "apps/desktop",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
